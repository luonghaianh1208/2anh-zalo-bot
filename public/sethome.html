<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZCA — SetHome (Tin nhắn acc phụ → acc chủ)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0d1117; color: #e6edf3; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 16px;
      padding: 40px 36px; width: 420px; text-align: left;
    }
    .card h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; text-align: center; }
    .card .sub { font-size: 13px; color: #8b949e; margin-bottom: 24px; text-align: center; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; font-weight: 500; }
    .field input, .field textarea {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
      background: #0d1117; color: #e6edf3; font-size: 14px; font-family: inherit;
    }
    .field textarea { height: 100px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: none; border-color: #58a6ff; }
    .btn {
      padding: 10px 28px; border-radius: 8px; border: none; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .btn-primary { background: #238636; color: #fff; width: 100%; margin-top: 4px; }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px;
      display: none;
    }
    .result.ok { background: #0d2818; border: 1px solid #238636; color: #3fb950; display: block; }
    .result.err { background: #2d1117; border: 1px solid #da3633; color: #f85149; display: block; }
    .nav { margin-top: 18px; text-align: center; font-size: 13px; }
    .nav a { color: #58a6ff; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .login-warn {
      background: #2d1117; border: 1px solid #da3633; border-radius: 10px;
      padding: 14px; margin-bottom: 18px; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📨 SetHome</h1>
    <div class="sub">Nhắn tin từ acc Zalo phụ (đã đăng nhập) → acc Zalo chủ</div>

    <div class="login-warn" id="loginWarn" style="display:none">
      ⚠️ Chưa đăng nhập acc phụ. <a href="/" style="color:#58a6ff">Quay lại trang QR Login</a>
    </div>

    <div id="mainForm">
      <div class="field">
        <label>UID Zalo chủ (số Zalo hoặc user ID)</label>
        <input type="text" id="uid" placeholder="Ví dụ: 0912345678 hoặc UID 10-12 chữ số" />
      </div>

      <div class="field">
        <label>Nội dung tin nhắn</label>
        <textarea id="message" placeholder="Nhập nội dung gửi về acc chủ..."></textarea>
      </div>

      <button class="btn btn-primary" id="btnSend" onclick="sendHome()">Gửi tin nhắn</button>

      <div class="result" id="result"></div>
    </div>

    <div class="nav">
      <a href="/">← Quay lại QR Login</a>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const resultEl = $('#result');
    const loginWarn = $('#loginWarn');
    const mainForm = $('#mainForm');
    const btnSend = $('#btnSend');

    // check login status
    fetch('/api/status').then(r => r.json()).then(j => {
      if (j.status !== 'logged-in') {
        loginWarn.style.display = '';
        mainForm.style.display = 'none';
      }
    });

    async function sendHome() {
      const uid = $('#uid').value.trim();
      const message = $('#message').value.trim();

      if (!uid) { showResult('Vui lòng nhập UID Zalo chủ', 'err'); return; }
      if (!message) { showResult('Vui lòng nhập nội dung tin nhắn', 'err'); return; }

      btnSend.disabled = true;
      btnSend.textContent = 'Đang gửi...';

      try {
        const r = await fetch('/api/send-home', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, message })
        });
        const j = await r.json();
        if (j.ok) {
          showResult('✅ Gửi thành công đến ' + uid, 'ok');
          // save last UID to localStorage
          localStorage.setItem('zca-last-uid', uid);
        } else {
          showResult('❌ ' + j.error, 'err');
        }
      } catch (e) {
        showResult('❌ Lỗi kết nối server', 'err');
      }

      btnSend.disabled = false;
      btnSend.textContent = 'Gửi tin nhắn';
    }

    function showResult(text, cls) {
      resultEl.textContent = text;
      resultEl.className = 'result ' + cls;
    }

    // restore last UID
    const lastUid = localStorage.getItem('zca-last-uid');
    if (lastUid) $('#uid').value = lastUid;
  </script>
</body>
</html>
