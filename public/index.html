<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zalo — Kết nối Hermes Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0d1117; color: #e6edf3; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 16px;
      padding: 36px 32px; width: min(760px, 100%); text-align: center;
    }
    h1 { font-size: 21px; font-weight: 600; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #8b949e; margin-bottom: 24px; line-height: 1.5; }
    .qr-box {
      width: 244px; height: 244px; margin: 0 auto 18px;
      background: #fff; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .qr-box img { width: 210px; height: 210px; image-rendering: pixelated; }
    .qr-box .placeholder { color: #6b7280; font-size: 13px; padding: 0 20px; }
    .qr-box .overlay {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 15px; font-weight: 600;
    }
    .overlay-scanned { background: rgba(35,134,54,.9); color: #fff; }
    .overlay-expired { background: rgba(0,0,0,.78); color: #f0883e; }
    .status { font-size: 13.5px; color: #8b949e; margin-bottom: 18px; min-height: 20px; }
    .status.ok  { color: #3fb950; }
    .status.err { color: #f85149; }
    .btn {
      padding: 10px 26px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-ghost { background: #30363d; color: #e6edf3; margin-left: 8px; }
    .btn-ghost:hover { background: #3d444d; }
    .btn-danger { background: #6e2b28; color: #ffb4ae; margin-left: 8px; }
    .btn-danger:hover { background: #8c3733; }
    .panel {
      background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
      padding: 14px 16px; margin-top: 18px; text-align: left;
      font-size: 13px; line-height: 1.7;
    }
    .panel .row { display: flex; justify-content: space-between; gap: 12px; }
    .panel .k { color: #8b949e; }
    .panel .v { color: #e6edf3; font-weight: 500; text-align: right; word-break: break-all; }
    .panel .v.on  { color: #3fb950; }
    .panel .v.off { color: #f0883e; }
    .hint {
      margin-top: 16px; padding: 12px 14px; border-radius: 10px;
      background: #10203a; border: 1px solid #1f3f6e;
      font-size: 12.5px; line-height: 1.65; color: #a9c7f0; text-align: left;
    }
    .hint code {
      background: #0d1117; padding: 1px 6px; border-radius: 4px;
      color: #79c0ff; font-size: 12px;
    }
    .health-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px; margin-top: 16px; text-align: left;
    }
    .metric {
      background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
      padding: 12px 14px; min-height: 82px;
    }
    .metric .label { color: #8b949e; font-size: 12px; margin-bottom: 5px; }
    .metric .value { font-size: 15px; font-weight: 600; }
    .metric .detail { color: #8b949e; font-size: 11.5px; margin-top: 5px; line-height: 1.4; }
    .healthy { color: #3fb950; }
    .degraded { color: #f0883e; }
    .unhealthy { color: #f85149; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔵 Zalo · Hermes Agent</h1>
    <div class="sub">Quét mã bằng Zalo trên điện thoại — nên dùng một tài khoản phụ</div>

    <div class="qr-box" id="qrBox">
      <div class="placeholder" id="qrPlaceholder">Nhấn “Tạo mã QR” để bắt đầu</div>
    </div>

    <div class="status" id="status"></div>

    <div>
      <button class="btn btn-primary" id="btnStart" onclick="startQR()">Tạo mã QR</button>
      <button class="btn btn-ghost"  id="btnRefresh" onclick="startQR()" hidden>Tạo lại</button>
      <button class="btn btn-danger" id="btnLogout"  onclick="doLogout()" hidden>Đăng xuất</button>
    </div>

    <div class="panel" id="panel" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="health-grid" id="healthGrid" hidden></div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const el = {
      status: $('#status'), box: $('#qrBox'), ph: $('#qrPlaceholder'),
      start: $('#btnStart'), refresh: $('#btnRefresh'), logout: $('#btnLogout'),
      panel: $('#panel'), hint: $('#hint'),
      health: $('#healthGrid'),
    };

    function setStatus(text, cls = '') {
      el.status.textContent = text;
      el.status.className = 'status' + (cls ? ' ' + cls : '');
    }

    function age(ms) {
      if (ms == null) return 'chưa có';
      if (ms < 1000) return 'vừa xong';
      if (ms < 60000) return `${Math.round(ms / 1000)} giây`;
      return `${Math.round(ms / 60000)} phút`;
    }

    function renderHealth(h) {
      const db = h.database || {};
      const bridge = h.bridge || {};
      const jobs = h.backfill || [];
      const backfill = jobs.length
        ? jobs.map(j => `${j.threadType === 1 ? 'Nhóm' : 'DM'}: ${j.status}, ${j.pagesFetched} trang`).join('<br>')
        : 'Đang chờ tự động';
      el.health.innerHTML = `
        <div class="metric"><div class="label">Tổng thể</div><div class="value ${h.status}">${h.status}</div><div class="detail">Uptime ${age(h.uptimeMs)}</div></div>
        <div class="metric"><div class="label">Lăng Tiêu</div><div class="value ${bridge.attachedClients ? 'healthy' : 'degraded'}">${bridge.attachedClients || 0} kết nối</div><div class="detail">Heartbeat: ${age(bridge.heartbeatAgeMs)} trước</div></div>
        <div class="metric"><div class="label">SQLite</div><div class="value ${db.ready ? 'healthy' : 'unhealthy'}">${db.ready ? 'sẵn sàng' : 'lỗi'}</div><div class="detail">${db.messageCount || 0} tin · ${db.auditCount || 0} audit</div></div>
        <div class="metric"><div class="label">Phân quyền</div><div class="value ${h.authorization?.ownerConfigured ? 'healthy' : 'unhealthy'}">public / owner</div><div class="detail">${h.authorization?.ownerConfigured ? 'Đã cấu hình UID owner' : 'Chưa có UID owner'}</div></div>
        <div class="metric"><div class="label">Backfill</div><div class="value">${backfill}</div><div class="detail">Tự động DM + nhóm · giữ 365 ngày</div></div>
        <div class="metric"><div class="label">Lưu lượng gần nhất</div><div class="value">Nhận: ${h.traffic?.lastInboundAtMs ? new Date(h.traffic.lastInboundAtMs).toLocaleString('vi-VN') : 'chưa có'}</div><div class="detail">Gửi: ${h.traffic?.lastOutboundAtMs ? new Date(h.traffic.lastOutboundAtMs).toLocaleString('vi-VN') : 'chưa có'}</div></div>
        <div class="metric"><div class="label">Lỗi gần nhất</div><div class="value ${h.lastError ? 'degraded' : 'healthy'}">${h.lastError?.code || 'Không có'}</div><div class="detail">${h.lastError?.message || 'Hệ thống chưa ghi nhận lỗi.'}</div></div>`;
      el.health.hidden = false;
    }

    function clearQr() {
      el.box.querySelector('img')?.remove();
      el.box.querySelector('.overlay')?.remove();
    }

    function showOverlay(text, cls) {
      let ov = el.box.querySelector('.overlay');
      if (!ov) { ov = document.createElement('div'); el.box.appendChild(ov); }
      ov.textContent = text;
      ov.className = 'overlay ' + cls;
    }

    function showConnected(state) {
      const u = state.user || {};
      const attached = !!state.hermesAttached;
      el.panel.innerHTML = `
        <div class="row"><span class="k">Tài khoản</span><span class="v">${u.display_name || '—'}</span></div>
        <div class="row"><span class="k">UID</span><span class="v">${u.user_id || '—'}</span></div>
        <div class="row"><span class="k">Hermes Agent</span>
          <span class="v ${attached ? 'on' : 'off'}">${attached ? 'đã kết nối' : 'chưa kết nối'}</span></div>
        <div class="row"><span class="k">Chế độ</span>
          <span class="v">${attached ? 'đầy đủ công cụ' : 'chatbot đơn giản'}</span></div>`;
      el.panel.hidden = false;

      el.hint.innerHTML = attached
        ? `Xong rồi — từ đây cứ <strong>ra lệnh thẳng cho Hermes</strong>.
           Tạo bình chọn, ghim ghi chú, đọc lịch sử nhóm, gửi tệp, đặt lời nhắc…
           đều nói bằng lời, không cần mở trang nào nữa.
           <br><br>Chưa nhận chủ thì nhắn <code>/sethome</code> cho tài khoản này
           từ Zalo cá nhân của bạn.`
        : `Zalo đã đăng nhập nhưng <strong>Hermes chưa cắm vào</strong>.
           Chạy <code>hermes gateway run</code> để dùng đầy đủ công cụ.
           <br><br>Trong lúc đó bot vẫn trả lời được, nhưng chỉ ở mức trò chuyện.`;
      el.hint.hidden = false;

      el.start.hidden = true;
      el.refresh.hidden = true;
      el.logout.hidden = false;
    }

    let ws;
    function connectWs() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        switch (m.type) {
          case 'qr-pending':
            setStatus('Đang tạo mã…');
            el.ph.textContent = 'Đang tạo mã…';
            el.ph.hidden = false;
            break;
          case 'qr-generated': {
            setStatus('Mở Zalo trên điện thoại và quét mã này');
            clearQr();
            const img = document.createElement('img');
            img.src = 'data:image/png;base64,' + m.data.image;
            el.box.appendChild(img);
            el.ph.hidden = true;
            break;
          }
          case 'qr-scanned':
            setStatus('Đã quét — xác nhận trên điện thoại');
            showOverlay('Đã quét ✓', 'overlay-scanned');
            break;
          case 'qr-expired':
            setStatus('Mã hết hạn', 'err');
            showOverlay('Hết hạn', 'overlay-expired');
            el.refresh.hidden = false;
            break;
          case 'qr-declined':
            setStatus('Bạn đã từ chối đăng nhập', 'err');
            showOverlay('Đã từ chối', 'overlay-expired');
            el.refresh.hidden = false;
            break;
          case 'login-success':
            setStatus('Kết nối thành công', 'ok');
            clearQr();
            el.ph.textContent = '✓';
            el.ph.hidden = false;
            refreshState();
            break;
          case 'logout':
            location.reload();
            break;
          case 'error':
            setStatus(m.data || 'Có lỗi xảy ra', 'err');
            el.refresh.hidden = false;
            break;
        }
      };
      ws.onclose = () => setTimeout(connectWs, 2000);
    }

    async function refreshState() {
      try {
        const [state, health] = await Promise.all([
          fetch('/api/status').then(r => r.json()),
          fetch('/api/health').then(r => r.json()),
        ]);
        if (state.status === 'logged-in') showConnected(state);
        renderHealth(health);
      } catch { /* server chưa sẵn sàng */ }
    }

    async function startQR() {
      el.start.hidden = true;
      el.refresh.hidden = true;
      el.ph.textContent = 'Đang tạo mã…';
      el.ph.hidden = false;
      clearQr();
      try {
        const r = await (await fetch('/api/qr/start', { method: 'POST', headers: { 'X-Zalo-Dashboard': '1' } })).json();
        if (!r.ok) { setStatus(r.error || 'Không tạo được mã', 'err'); el.refresh.hidden = false; }
      } catch {
        setStatus('Không liên lạc được với máy chủ', 'err');
        el.refresh.hidden = false;
      }
    }

    async function doLogout() {
      if (!confirm('Đăng xuất khỏi Zalo? Lần sau phải quét mã lại.')) return;
      await fetch('/api/logout', { method: 'POST', headers: { 'X-Zalo-Dashboard': '1' } });
      location.reload();
    }

    connectWs();
    refreshState();
    setInterval(refreshState, 15000);   // theo dõi Hermes cắm vào / rút ra
  </script>
</body>
</html>
